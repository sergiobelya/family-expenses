doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            user_id: App\Core\Infrastructure\Persistence\Doctrine\Type\UserIdType
            family_id: App\Core\Infrastructure\Persistence\Doctrine\Type\FamilyIdType
            family_member_id: App\Core\Infrastructure\Persistence\Doctrine\Type\FamilyMemberIdType
            invitation_id: App\Core\Infrastructure\Persistence\Doctrine\Type\InvitationIdType
            invitation_use_id: App\Core\Infrastructure\Persistence\Doctrine\Type\InvitationUseIdType
            store_id: App\Core\Infrastructure\Persistence\Doctrine\Type\StoreIdType
            store_alias_id: App\Core\Infrastructure\Persistence\Doctrine\Type\StoreAliasIdType
            category_id: App\Core\Infrastructure\Persistence\Doctrine\Type\CategoryIdType
            audit_log_id: App\Core\Infrastructure\Persistence\Doctrine\Type\AuditLogIdType
            outbox_message_id: App\Core\Infrastructure\Persistence\Doctrine\Type\OutboxMessageIdType
            telegram_update_inbox_id: App\Core\Infrastructure\Persistence\Doctrine\Type\TelegramUpdateInboxIdType
            expense_id: App\Core\Infrastructure\Persistence\Doctrine\Type\ExpenseIdType
            allocation_id: App\Core\Infrastructure\Persistence\Doctrine\Type\AllocationIdType
            expense_save_attempt_id: App\Expense\Infrastructure\Persistence\Doctrine\Type\ExpenseSaveAttemptIdType
            country_code: App\Core\Infrastructure\Persistence\Doctrine\Type\CountryCodeType
            family_name: App\Family\Infrastructure\Persistence\Doctrine\Type\FamilyNameType
            store_name: App\Catalog\Infrastructure\Persistence\Doctrine\Type\StoreNameType
            category_name: App\Catalog\Infrastructure\Persistence\Doctrine\Type\CategoryNameType
    orm:
        auto_generate_proxy_classes: false
        enable_native_lazy_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Identity\Domain\Entity'
                alias: Identity
            Family:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Family/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Family\Domain\Entity'
                alias: Family
            Catalog:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Catalog\Domain\Entity'
                alias: Catalog
            Core:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Core\Infrastructure\Persistence\Doctrine\Entity'
                alias: Core
            Expense:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Expense/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Expense\Domain\Entity'
                alias: Expense

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
