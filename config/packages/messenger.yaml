framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - validation
                    - doctrine_transaction
            query.bus:
                middleware:
                    - validation
            event.bus:
                default_middleware: allow_no_handlers

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Core\Infrastructure\Outbox\OutboxEnvelopeSerializer
            failed: 'doctrine://default?queue_name=failed'

        routing:
            'App\Core\Infrastructure\Outbox\OutboxEnvelope': async
